name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Android Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust with Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Android Project
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64-linux-android

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/Shard-arm64-v8a.apk \; || true
          ls -la dist-apk/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shard-Android-APK
          path: dist-apk/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-apk/*.apk
