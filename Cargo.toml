[package]
name = "better-obsidian"
version = "0.1.0"
edition = "2021"
description = "Lightweight, native Windows-first desktop Markdown vault app"
authors = ["Better Obsidian Contributors"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29.1"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
walkdir = "2.5"
